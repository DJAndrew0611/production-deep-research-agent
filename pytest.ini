[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    --tb=short 
    --strict-markers
    -W ignore::DeprecationWarning
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (may require DB)
    benchmark: Offline benchmark evaluation tests
    safety: Security and prompt injection tests
